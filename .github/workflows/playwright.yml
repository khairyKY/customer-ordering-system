# ============================================================
# Playwright E2E — Python POM suite (src/backend_python/tests/playwright)
#
# NOTE: best-effort rewrite. The previous workflow ran the JavaScript
# `npx playwright test` runner, but this repo's E2E suite is *Python*
# Playwright driven by pytest (pytest.ini marker `e2e`, conftest at
# src/backend_python/tests/playwright/conftest.py). This file targets
# the real suite and waits for both servers before running tests.
# May need iteration once observed against a live CI run.
# ============================================================
name: Playwright E2E

on:
  push:
    branches: [ main, "release/*", "feat/*" ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: src/backend_python
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm install

      - name: Install Playwright browser (Chromium)
        working-directory: src/backend_python
        run: python -m playwright install --with-deps chromium

      - name: Seed database
        working-directory: src/backend_python
        run: python -m scripts.seed

      - name: Start backend (uvicorn :8000)
        working-directory: src/backend_python
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          echo "started uvicorn (pid $!)"

      - name: Start frontend (vite :5173)
        working-directory: src/frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > frontend.log 2>&1 &
          echo "started vite (pid $!)"

      - name: Wait for servers (dumps logs on failure)
        run: |
          # http-get:// forces a GET probe — FastAPI's @app.get("/health")
          # rejects the default HEAD request with 405.
          npx --yes wait-on http-get://127.0.0.1:8000/health http-get://127.0.0.1:5173 --timeout 120000 || {
            echo "::group::backend.log";  cat src/backend_python/backend.log  2>/dev/null || echo "(no backend.log)";  echo "::endgroup::"
            echo "::group::frontend.log"; cat src/frontend/frontend.log       2>/dev/null || echo "(no frontend.log)"; echo "::endgroup::"
            exit 1
          }

      - name: Run Playwright E2E specs
        working-directory: src/backend_python
        run: pytest tests/playwright/ -v -m e2e
        env:
          CI: true
          PYTHON_API_BASE: http://127.0.0.1:8000/api/v1
          FRONTEND_BASE: http://127.0.0.1:5173
