# ============================================================
# Playwright E2E — Python POM suite (src/backend_python/tests/playwright)
#
# NOTE: best-effort rewrite. The previous workflow ran the JavaScript
# `npx playwright test` runner, but this repo's E2E suite is *Python*
# Playwright driven by pytest (pytest.ini marker `e2e`, conftest at
# src/backend_python/tests/playwright/conftest.py). This file targets
# the real suite and waits for both servers before running tests.
# May need iteration once observed against a live CI run.
# ============================================================
name: Playwright E2E

on:
  push:
    branches: [ main, "release/*", "feat/*" ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: src/backend_python
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm install

      - name: Install Playwright browser (Chromium)
        working-directory: src/backend_python
        run: python -m playwright install --with-deps chromium

      - name: Seed database
        working-directory: src/backend_python
        run: python -m scripts.seed

      - name: Run Playwright E2E (servers + suite, single step)
        run: |
          # Servers + wait + pytest run in ONE step so the backgrounded
          # processes never cross a step boundary (npm->vite gets reaped
          # otherwise). Each server runs in a subshell so its CWD is
          # correct — the backend must share the seed step's working
          # dir to open the same SQLite file.
          ( cd src/backend_python && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 ) > backend.log 2>&1 &
          ( cd src/frontend && npm run dev -- --host 127.0.0.1 --port 5173 ) > frontend.log 2>&1 &

          # Backend: http-get:// forces a GET probe (FastAPI's @app.get
          # rejects wait-on's default HEAD with 405).
          # Frontend: plain tcp: probe — an HTTP GET against the vite dev
          # server's root proved unreliable here; a listening socket is
          # all Playwright needs to navigate.
          npx --yes wait-on http-get://127.0.0.1:8000/health tcp:127.0.0.1:5173 --timeout 120000 || {
            echo "=== backend.log ===";  cat backend.log  2>/dev/null || echo "(none)"
            echo "=== frontend.log ==="; cat frontend.log 2>/dev/null || echo "(none)"
            exit 1
          }

          # Capture pytest's exit code so we can ALWAYS dump backend.log
          # (CI's `set -e` would otherwise skip the dump on test failures —
          # exactly when we need it most to see what API calls the browser
          # actually issued).
          cd src/backend_python && pytest tests/playwright/ -v -m e2e; rc=$?
          cd ../..
          echo "=== backend.log (post-pytest) ==="
          tail -200 backend.log || true
          exit $rc
        env:
          CI: true
          PYTHON_API_BASE: http://127.0.0.1:8000/api/v1
          FRONTEND_BASE: http://127.0.0.1:5173
          # Frontend axios client reads this at vite startup; without it,
          # the browser (at 127.0.0.1:5173) calls http://localhost:8000 —
          # a different origin from its page origin.
          VITE_PYTHON_API_BASE: http://127.0.0.1:8000/api/v1
          # Backend must accept the 127.0.0.1 page origin or every API
          # response is CORS-blocked and the admin tables stay empty.
          CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3001"
