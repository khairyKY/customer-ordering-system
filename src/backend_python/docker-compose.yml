services:
  db:
    image: postgres:15-alpine
    container_name: cos_postgres
    environment:
      POSTGRES_DB: cos
      POSTGRES_USER: cos
      POSTGRES_PASSWORD: cos
    ports:
      - "5432:5432"
    volumes:
      - cos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cos"]
      interval: 5s
      retries: 5

volumes:
  cos_pgdata:
